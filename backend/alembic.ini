[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by DATABASE_URL env var at runtime)
sqlalchemy.url = sqlite+aiosqlite:///./data/dev.db

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local timezone
timezone =

# max length of characters to apply to the
# "version" code
version_code_length = 12

# the set of characters allowed in versions
# when using the "date" or "da" template
version_code_chars = abcdefghijklmnopqrstuvwxyz0123456789_-

# the naming style to use when generating new migration files
# can be "date", "da", or "generic"
# default: generic
prepend_version_code = true

sqlalchemy.warn_20 = true

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated migration scripts. See the documentation for further detail and
# examples

# format using "black" - use the console script
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION script.py

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
